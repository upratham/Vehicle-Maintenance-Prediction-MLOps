<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Maintenance Prediction</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .tabs {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
        }
        .tab-btn {
            padding: 0.75rem 1.5rem;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--muted);
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            transition: all 0.2s;
            margin-bottom: -1px;
        }
        .tab-btn:hover { color: var(--text); }
        .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .result-score {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 0.3rem;
        }
    </style>
</head>
<body>

<header class="header">
    <div class="header-icon">🚗</div>
    <h1>Vehicle <span>Maintenance</span> Prediction</h1>
</header>

<main class="main">

    <!-- Tab Navigation -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('vm', this)">Vehicle Maintenance</button>
        <button class="tab-btn" onclick="switchTab('hyundai', this)">Hyundai Anomaly</button>
        <button class="tab-btn" onclick="switchTab('engine', this)">Engine Condition</button>
    </div>

    <!-- ── Tab 1: Vehicle Maintenance ──────────────────────────────────── -->
    <div id="tab-vm" class="tab-panel active">
        <form method="post" action="/">

            <div class="section-title">Vehicle Metrics</div>
            <div class="card">
                <div class="grid-3">
                    <div class="field">
                        <label>Vehicle Age (years)</label>
                        <input type="number" name="Vehicle_Age" placeholder="e.g. 5" required>
                    </div>
                    <div class="field">
                        <label>Engine Size (cc)</label>
                        <input type="number" name="Engine_Size" placeholder="e.g. 1500" required>
                    </div>
                    <div class="field">
                        <label>Odometer Reading</label>
                        <input type="number" name="Odometer_Reading" placeholder="e.g. 60000" required>
                    </div>
                    <div class="field">
                        <label>Fuel Efficiency (km/l)</label>
                        <input type="number" step="0.01" name="Fuel_Efficiency" placeholder="e.g. 14.5" required>
                    </div>
                </div>
            </div>

            <div class="section-title">Service & History</div>
            <div class="card">
                <div class="grid-3">
                    <div class="field">
                        <label>Reported Issues</label>
                        <input type="number" name="Reported_Issues" placeholder="e.g. 2" required>
                    </div>
                    <div class="field">
                        <label>Accident History (count)</label>
                        <input type="number" name="Accident_History" placeholder="e.g. 1" required>
                    </div>
                </div>
            </div>

            <div class="section-title">Condition Assessment</div>
            <div class="card">
                <div class="grid-2">
                    <div class="field">
                        <label>Tire Condition</label>
                        <select name="Tire_Condition" required>
                            <option value="" disabled selected>Select condition</option>
                            <option value="Worn Out">Worn Out</option>
                            <option value="Good">Good</option>
                            <option value="New">New</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Brake Condition</label>
                        <select name="Brake_Condition" required>
                            <option value="" disabled selected>Select condition</option>
                            <option value="Worn Out">Worn Out</option>
                            <option value="Good">Good</option>
                            <option value="New">New</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Battery Status</label>
                        <select name="Battery_Status" required>
                            <option value="" disabled selected>Select status</option>
                            <option value="Weak">Weak</option>
                            <option value="Good">Good</option>
                            <option value="Strong">Strong</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="section-title">Vehicle Details</div>
            <div class="card">
                <div class="grid-2">
                    <div class="field">
                        <label>Vehicle Model</label>
                        <select name="Vehicle_Model" required>
                            <option value="" disabled selected>Select model</option>
                            <option>Bus</option>
                            <option>Van</option>
                            <option>SUV</option>
                            <option>Truck</option>
                            <option>Motorcycle</option>
                            <option>Car</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Fuel Type</label>
                        <select name="Fuel_Type" required>
                            <option value="" disabled selected>Select fuel type</option>
                            <option>Petrol</option>
                            <option>Diesel</option>
                            <option>Electric</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Transmission Type</label>
                        <select name="Transmission_Type" required>
                            <option value="" disabled selected>Select transmission</option>
                            <option>Manual</option>
                            <option>Automatic</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="submit-row">
                <button type="submit" class="predict-btn">Run Prediction</button>
            </div>
        </form>

        {% if context and context != "Rendering" %}
            <div class="result-box {% if context == 'Maintenance Required' %}warning{% endif %}">
                <div>
                    <div class="result-label">Prediction Result</div>
                    <div class="result-value">{{ context }}</div>
                </div>
            </div>
        {% endif %}
    </div>

    <!-- ── Tab 2: Hyundai Cars Anomaly Detection ────────────────────────── -->
    <div id="tab-hyundai" class="tab-panel">
        <form id="form-hyundai" onsubmit="submitJson(event, 'hyundai')">

            <div class="section-title">Sensor Readings</div>
            <div class="card">
                <div class="grid-3">
                    <div class="field">
                        <label>Engine Temperature (°C)</label>
                        <input type="number" step="0.1" name="engine_temperature" placeholder="e.g. 85.5" required>
                    </div>
                    <div class="field">
                        <label>Brake Pad Thickness (mm)</label>
                        <input type="number" step="0.1" name="brake_pad_thickness" placeholder="e.g. 8.2" required>
                    </div>
                    <div class="field">
                        <label>Tire Pressure (PSI)</label>
                        <input type="number" step="0.1" name="tire_pressure" placeholder="e.g. 32.0" required>
                    </div>
                </div>
            </div>

            <div class="section-title">Maintenance Info</div>
            <div class="card">
                <div class="grid-2">
                    <div class="field">
                        <label>Maintenance Type</label>
                        <select name="maintenance_type" required>
                            <option value="" disabled selected>Select type</option>
                            <option value="Repair">Repair</option>
                            <option value="Routine Maintenance">Routine Maintenance</option>
                            <option value="Component Replacement">Component Replacement</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="submit-row">
                <button type="submit" class="predict-btn">Run Prediction</button>
            </div>
        </form>

        <div id="result-hyundai" class="result-box" style="display:none; margin-top:2rem;">
            <div>
                <div class="result-label">Anomaly Detection Result</div>
                <div class="result-value" id="result-hyundai-value"></div>
                <div class="result-score" id="result-hyundai-score"></div>
            </div>
        </div>
    </div>

    <!-- ── Tab 3: Engine Condition ──────────────────────────────────────── -->
    <div id="tab-engine" class="tab-panel">
        <form id="form-engine" onsubmit="submitJson(event, 'engine')">

            <div class="section-title">Engine Sensor Data</div>
            <div class="card">
                <div class="grid-3">
                    <div class="field">
                        <label>Engine RPM</label>
                        <input type="number" step="0.1" name="engine_rpm" placeholder="e.g. 3500" required>
                    </div>
                    <div class="field">
                        <label>Lub Oil Pressure</label>
                        <input type="number" step="0.01" name="lub_oil_pressure" placeholder="e.g. 2.5" required>
                    </div>
                    <div class="field">
                        <label>Fuel Pressure</label>
                        <input type="number" step="0.01" name="fuel_pressure" placeholder="e.g. 45.0" required>
                    </div>
                    <div class="field">
                        <label>Coolant Pressure</label>
                        <input type="number" step="0.01" name="coolant_pressure" placeholder="e.g. 1.2" required>
                    </div>
                    <div class="field">
                        <label>Lub Oil Temp</label>
                        <input type="number" step="0.1" name="lub_oil_temp" placeholder="e.g. 70.0" required>
                    </div>
                    <div class="field">
                        <label>Coolant Temp</label>
                        <input type="number" step="0.1" name="coolant_temp" placeholder="e.g. 85.0" required>
                    </div>
                </div>
            </div>

            <div class="submit-row">
                <button type="submit" class="predict-btn">Run Prediction</button>
            </div>
        </form>

        <div id="result-engine" class="result-box" style="display:none; margin-top:2rem;">
            <div>
                <div class="result-label">Engine Condition Result</div>
                <div class="result-value" id="result-engine-value"></div>
                <div class="result-score" id="result-engine-score"></div>
            </div>
        </div>
    </div>

</main>

<script>
    function switchTab(name, btn) {
        document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('tab-' + name).classList.add('active');
        btn.classList.add('active');
    }

    async function submitJson(event, model) {
        event.preventDefault();
        const form = event.target;
        const btn = form.querySelector('button[type="submit"]');
        const resultBox = document.getElementById('result-' + model);
        const resultValue = document.getElementById('result-' + model + '-value');
        const resultScore = document.getElementById('result-' + model + '-score');

        btn.disabled = true;
        btn.textContent = 'Running...';

        const data = {};
        new FormData(form).forEach((val, key) => {
            const num = Number(val);
            data[key] = val !== '' && !isNaN(num) ? num : val;
        });

        try {
            const res = await fetch('/predict/' + model, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data),
            });
            const json = await res.json();
            if (json.error) throw new Error(json.error);

            const isWarning = json.label === 1;
            resultBox.className = 'result-box' + (isWarning ? ' warning' : '');
            resultBox.style.display = 'flex';
            resultValue.textContent = json.status;
            resultScore.textContent = 'Confidence: ' + (json.score * 100).toFixed(1) + '%';
        } catch (err) {
            resultBox.className = 'result-box warning';
            resultBox.style.display = 'flex';
            resultValue.textContent = 'Error: ' + err.message;
            resultScore.textContent = '';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Run Prediction';
        }
    }
</script>

</body>
</html>
