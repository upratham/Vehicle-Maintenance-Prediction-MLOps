server {
    listen 80;

    # Serve the React SPA
    root /usr/share/nginx/html;
    index index.html;

    # All API routes → FastAPI backend container
    location ~ ^/(predict|model_info|drift|train) {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   Connection        "";
        # Required for SSE log streaming from /train
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
    }

    # React SPA fallback — always return index.html for unknown routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
